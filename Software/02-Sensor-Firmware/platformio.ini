; AquaLoop AI — sensor node firmware for the Freenove ESP32-S3 dev board.
; This firmware is READ-ONLY with respect to equipment: it publishes sensor
; telemetry over MQTT and never drives a relay, valve, compressor, pump, or
; power-transfer output. All actuation belongs to the Industrial PLC — see
; edge/plc-spec/.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit MAX31865 library@^1.3.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
